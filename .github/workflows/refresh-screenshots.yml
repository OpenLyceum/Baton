name: Refresh Screenshot Thumbnails

# Capture live GitHub Pages sims, regenerate card WebP thumbs, and open a PR.
# Prefer this over building every sim in CI — Pages is already the deployed artifact.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:
    inputs:
      repos:
        description: "Optional space/comma-separated sim names (default: all active sims)"
        type: string
        required: false
      install-screenshots:
        description: "Also open PWA install screenshot PRs for the named sims"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-screenshots
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          # Mirrors the fleet Node default in ci.yml / deploy.yml / fleet-health.yml.
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live Pages screenshots
        env:
          ONLY: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          mkdir -p screenshots "$RUNNER_TEMP/live-captures"
          mapfile -t SIMS < <(node -e '
            const catalog = require("./structure/repos.json");
            const only = (process.env.ONLY || "").split(/[\s,]+/).filter(Boolean);
            const sims = catalog.repos
              .filter((r) => r.isSimulation && r.status === "active" && r.framework === "SceneryStack")
              .map((r) => r.name)
              .filter((n) => only.length === 0 || only.includes(n));
            console.log(sims.join("\n"));
          ')
          # ShellCheck sees shell syntax; the template literal is evaluated by Node.
          # shellcheck disable=SC2016
          PAGES_BASE="$(node -p 'const c = require("./structure/repos.json"); c.pagesBase || `https://${c.organization.toLowerCase()}.github.io`')"
          for sim in "${SIMS[@]}"; do
            url="${PAGES_BASE}/${sim}/?screens=1"
            echo "Capturing ${sim} from ${url}"
            if npx playwright screenshot \
              --browser chromium \
              --viewport-size=1154,753 \
              --wait-for-selector="#sim" \
              --wait-for-timeout=1000 \
              --timeout=20000 \
              "$url" "$RUNNER_TEMP/live-captures/${sim}.png"; then
              cp "$RUNNER_TEMP/live-captures/${sim}.png" "screenshots/${sim}.png"
            else
              rm -f "$RUNNER_TEMP/live-captures/${sim}.png"
              echo "::warning::Failed to capture ${sim}"
            fi
          done

      - name: Make card thumbnails
        run: node scripts/make-thumbnails.mjs

      - name: Regenerate Pages index
        run: scripts/generate-pages-index.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          # GITHUB_TOKEN cannot open PRs while can_approve_pull_request_reviews
          # is off. FLEET_PAT is the org write token used by fleet-exec.
          token: ${{ secrets.FLEET_PAT || github.token }}
          commit-message: "chore: refresh Pages screenshot thumbnails"
          title: "chore: refresh Pages screenshot thumbnails"
          body: |
            Automated weekly (or manual) refresh of Baton card screenshots from live GitHub Pages.

            - Captured `screenshots/*.png` from the deployed Pages site for each sim
            - Regenerated `docs/assets/*.webp` via `make-thumbnails.mjs`
            - Regenerated `docs/index.html` via `generate-pages-index.sh`
          branch: chore/refresh-screenshots
          delete-branch: true

      - name: Refresh install screenshots for selected sims
        if: inputs.install-screenshots
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
          ONLY: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Install screenshot PRs require FLEET_PAT"
            exit 1
          fi
          read -r -a sims <<< "${ONLY//,/ }"
          if [[ ${#sims[@]} -eq 0 ]]; then
            echo "::error::Specify the sims that need install screenshot PRs"
            exit 1
          fi
          export CAPTURES="$RUNNER_TEMP/live-captures"
          for sim in "${sims[@]}"; do
            if [[ ! "$sim" =~ ^[a-zA-Z0-9._-]+$ || ! -s "$CAPTURES/$sim.png" ]]; then
              echo "::error::No new capture for $sim"
              exit 1
            fi
            # shellcheck disable=SC2016
            scripts/fleet-exec.sh --simulation --only "$sim" --apply --replace \
              --branch chore/refresh-install-screenshots --title "chore: refresh PWA install screenshots" \
              --body "Refresh the install screenshots from the deployed simulation." -- bash -ec '
                grep -Fq -- --screenshots-only scripts/generate-icons.ts
                npm ci
                mkdir -p assets
                cp "$CAPTURES/$REPO_NAME.png" assets/screenshot.png
                node scripts/generate-icons.ts --screenshots-from-assets --screenshots-only
              '
          done
