name: CI

on:
  workflow_call:
    inputs:
      node-version:
        # Default Node version for the fleet. Mirrored in every Baton workflow that
        # runs setup-node — bump them together (enforced by check-node-version.sh).
        # See Baton/README.md ("Node version").
        type: string
        default: "26"
      run-architecture:
        # Opt in after adopting the strengthened template config and resolving findings.
        type: boolean
        default: false
      unused-mode:
        # off | advisory | required. Promote only after reviewing both Knip modes.
        type: string
        default: "off"
      run-tests:
        # Tri-state: "true" forces the test step on, "false" forces it off, and the
        # default "" means auto — run tests when the repo defines a "test" npm script.
        # String (not boolean) so "unset" is distinguishable from "off".
        type: string
        default: ""
      run-browser-tests:
        description: Run the caller's sim-specific Chromium regression tests.
        type: boolean
        default: false

permissions:
  contents: read

# No concurrency block here: this workflow is workflow_call-only, and callers
# already define the ci-${{ github.workflow }}-${{ github.ref }} group. Declaring
# the same group in the called workflow makes GitHub detect a deadlock with the
# caller's run and kill the reusable call at startup, so the build never runs.

jobs:
  browser:
    if: inputs.run-browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  unused:
    if: inputs.unused-mode != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.unused-mode == 'advisory' }}
    steps:
      - name: Validate rollout mode
        env:
          UNUSED_MODE: ${{ inputs.unused-mode }}
        run: |
          case "$UNUSED_MODE" in
            advisory|required) ;;
            *) echo "unused-mode must be off, advisory, or required" >&2; exit 2 ;;
          esac

      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
      - run: npm ci

      - name: Inventory default and production code
        shell: bash
        run: |
          mkdir -p knip-reports
          failed=0
          for mode in default production; do
            args=()
            if [ "$mode" = production ]; then args+=(--production); fi
            status=0
            npm run --silent knip -- "${args[@]}" --reporter json \
              > "knip-reports/$mode.json" 2> "knip-reports/$mode.stderr" || status=$?
            valid=true
            if ! jq -e 'type == "object" and (.issues | type == "array")' "knip-reports/$mode.json" >/dev/null; then
              valid=false
            fi
            echo "$status" > "knip-reports/$mode.exit-code"
            echo "$valid" > "knip-reports/$mode.valid-json"
            echo "Knip $mode: exit $status, valid JSON: $valid" >> "$GITHUB_STEP_SUMMARY"
            cat "knip-reports/$mode.stderr"
            if [ "$status" -ne 0 ] || [ "$valid" != true ]; then failed=1; fi
          done
          exit "$failed"

      - name: Upload Knip reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: knip-reports
          path: knip-reports/
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # Must stay fully qualified: `uses:` accepts no expressions, and inside a
        # reusable workflow a local `./` path resolves against the CALLER's
        # checkout, not this repo. Renaming the org means editing this line.
        uses: OpenLyceum/Baton/.github/actions/security-audit@main

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries
        if: inputs.run-architecture
        run: |
          npm run test:architecture
          npm run check:architecture

      - name: Type check
        run: npm run check

      # SceneryStack sims ship a "test" script (fleet-standard). Auto-run when the
      # script exists; force on/off via run-tests "true"/"false". Non-sim callers
      # without a test script stay green without per-repo config.
      - name: Test
        if: inputs.run-tests != 'false'
        env:
          RUN_TESTS: ${{ inputs.run-tests }}
        run: |
          set -euo pipefail
          if [ "$RUN_TESTS" = "true" ]; then
            npm test
          elif jq -e '.scripts.test // empty' package.json >/dev/null 2>&1; then
            npm test
          else
            echo "No \"test\" script defined and run-tests not forced; skipping."
          fi

      - name: Build
        run: npm run build

      - name: Check built PWA
        uses: OpenLyceum/Baton/.github/actions/check-pwa@main
