name: Shared compliance check

on:
  workflow_call:
    inputs:
      repo-name:
        description: Repository name to check (defaults to calling repository)
        type: string
        required: false
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  check-single:
    # When invoked via `uses:` the event is the caller's (push/pull_request/schedule),
    # never 'workflow_call'; run for those. The fleet-audit path below only makes
    # sense in Baton itself (it needs structure/repos.json), so dispatch/schedule in
    # any other repo — e.g. a sim's weekly cron — takes the single-repo path too.
    if: github.repository != format('{0}/Baton', github.repository_owner) || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository under test
        uses: actions/checkout@v7.0.1

      # The compliance script lives in this orchestration repo (Baton), not in the
      # caller, so check it out alongside and run it against the caller's working tree.
      - name: Check out Baton for the compliance script
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Baton
          path: .org-compliance

      # Inputs and event fields reach the script through env, never by direct
      # ${{ }} interpolation into the shell.
      - name: Run compliance checks
        env:
          INPUT_REPO: ${{ inputs.repo-name }}
          CALLER_REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REPO="${INPUT_REPO:-$CALLER_REPO}"
          echo "Checking repository: $REPO"
          GITHUB_REPOSITORY="$OWNER/$REPO" \
            bash .org-compliance/scripts/check-repo-compliance.sh "$PWD"

      # Template drift is advisory in a sim's own CI: a template change would otherwise
      # turn every sim red until it is propagated. The weekly fleet audit below fails
      # on drift instead, which is the signal to run check-template-drift.sh --fix.
      - name: Check out SceneryStackTemplate for the drift check
        if: hashFiles('src/main.ts') != ''
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository_owner }}/SceneryStackTemplate
          path: .org-template

      - uses: actions/setup-node@v7.0.0
        if: hashFiles('src/main.ts') != ''
        with:
          # Mirrors the fleet Node default — bump all setup-node workflows together.
          node-version: "24"

      - name: Template drift (advisory)
        if: hashFiles('src/main.ts') != ''
        continue-on-error: true
        env:
          INPUT_REPO: ${{ inputs.repo-name }}
          CALLER_REPO: ${{ github.event.repository.name }}
        run: |
          REPO="${INPUT_REPO:-$CALLER_REPO}"
          if ! node .org-compliance/scripts/check-template-drift.mjs --template .org-template --dir "$PWD" --name "$REPO"; then
            echo "::warning title=Template drift::$REPO differs from SceneryStackTemplate — run Baton/scripts/check-template-drift.sh --fix $REPO (or add a Compliance carve-out)"
            exit 1
          fi

  # Org-wide audit (dispatch/schedule). Fan out one sim per runner so they audit in
  # parallel with isolated logs, mirroring fleet-health.yml: `discover` builds the
  # sim list from the catalog, `audit` checks each, `report` aggregates pass/fail.
  discover-all:
    # Baton-only: the catalog (structure/repos.json) lives here, not in the callers.
    if: github.repository == format('{0}/Baton', github.repository_owner) && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the sim matrix
        id: list
        run: |
          set -euo pipefail
          # Deliberately wider than fleet-health.yml (active only): structure and
          # README rules apply from a sim's first commit, while lint/build/test
          # health is only tracked once a sim is active.
          matrix=$(jq -c '[.repos[] | select(.isSimulation == true and (.status == "active" or .status == "draft" or .status == "wip")) | .name]' structure/repos.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  audit:
    needs: discover-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sim: ${{ fromJson(needs.discover-all.outputs.matrix) }}
    steps:
      - name: Check out Baton for the compliance script
        uses: actions/checkout@v7.0.1

      - name: Check out SceneryStackTemplate for the drift check
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository_owner }}/SceneryStackTemplate
          path: .org-template

      - uses: actions/setup-node@v7.0.0
        with:
          # Mirrors the fleet Node default — bump all setup-node workflows together.
          node-version: "24"

      - name: Audit ${{ matrix.sim }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIM: ${{ matrix.sim }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          WORKDIR=$(mktemp -d)
          if ! gh repo clone "$OWNER/$SIM" "$WORKDIR" -- --depth 1 --quiet; then
            echo "| $SIM | ❌ clone | – |" > "row-$SIM.md"
            exit 1
          fi
          rc=0
          compliance="✅"
          if ! GITHUB_REPOSITORY="$OWNER/$SIM" ./scripts/check-repo-compliance.sh "$WORKDIR"; then
            compliance="❌"
            rc=1
          fi
          drift="✅"
          if [ -f "$WORKDIR/src/main.ts" ] && ! node scripts/check-template-drift.mjs --template .org-template --dir "$WORKDIR" --name "$SIM"; then
            drift="❌"
            rc=1
          fi
          echo "| $SIM | $compliance | $drift |" > "row-$SIM.md"
          rm -rf "$WORKDIR"
          exit "$rc"

      - name: Upload row
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: compliance-row-${{ matrix.sim }}
          path: row-${{ matrix.sim }}.md
          if-no-files-found: ignore

  report-all:
    needs: [discover-all, audit]
    if: always() && github.repository == format('{0}/Baton', github.repository_owner) && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Download rows
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: compliance-row-*
          path: rows
          merge-multiple: true

      - name: Assemble report
        run: |
          set -euo pipefail
          {
            echo "# Fleet compliance report"
            echo
            echo "| Repo | Compliance | Template drift |"
            echo "|---|:--:|:--:|"
            find rows -name '*.md' -exec cat {} + 2>/dev/null | sort || true
          } >> "$GITHUB_STEP_SUMMARY"

          if find rows -name '*.md' -exec cat {} + 2>/dev/null | grep -q '❌'; then
            echo "One or more simulations failed compliance or drifted from the template — see the table above (fix drift with scripts/check-template-drift.sh --fix <Sim>)." >&2
            exit 1
          fi
