name: Shared dependency review

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  security-events: read

jobs:
  code-security:
    if: github.event.repository.private == true
    uses: ./.github/workflows/shared-code-security-availability.yml

  dependency-review:
    name: Review dependencies
    needs: code-security
    if: >-
      !cancelled() &&
      (github.event.repository.private != true ||
       (needs.code-security.result == 'success' && needs.code-security.outputs.unavailable == 'false'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
