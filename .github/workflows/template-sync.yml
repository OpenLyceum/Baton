name: Template Sync

# Weekly: turn template drift into PRs instead of a red table. For every simulation,
# run check-template-drift.mjs --fix against SceneryStackTemplate's main branch and
# open (or update) one `chore/template-sync` PR per sim that changed. Approved
# deviations (AGENTS.md "## Compliance carve-outs") are left alone by --fix.
#
# Pushing to other repos needs the FLEET_PAT secret (doc/fleet-auth.md). Without it the
# run falls back to a dry-run that only prints each sim's diffstat.

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC, after the 06:00 compliance audit and 07:00 fleet health
  workflow_dispatch:
    inputs:
      only:
        description: 'Sync a single repo by name (default: every simulation)'
        type: string
        default: ''
      apply:
        description: 'Open/update PRs (off = dry-run, prints diffs only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out SceneryStackTemplate
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository_owner }}/SceneryStackTemplate
          path: .org-template

      - uses: actions/setup-node@v7.1.0
        with:
          # Mirrors the fleet Node default — bump all setup-node workflows together.
          node-version: '26'

      - name: Sync template-owned files
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT || github.token }}
          HAS_FLEET_PAT: ${{ secrets.FLEET_PAT != '' }}
          ONLY: ${{ inputs.only }}
          # A scheduled run applies when the PAT exists; a manual run applies only when asked.
          DO_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          args=(--branch chore/template-sync --replace
                --title "chore: sync template-owned files"
                --body "Automated by Baton's template-sync workflow: \`check-template-drift.mjs --fix\` against SceneryStackTemplate@main. If a difference here is deliberate, close this PR and record the path under AGENTS.md \`## Compliance carve-outs\` instead.")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); else args+=(--simulation); fi
          if [ "$DO_APPLY" = "true" ]; then
            if [ "$HAS_FLEET_PAT" = "true" ]; then
              args+=(--apply)
            else
              echo "::warning title=Template sync::FLEET_PAT is not set — running as a dry-run (see doc/fleet-auth.md)"
            fi
          fi
          # --fix exits 1 when drift remains that it cannot fix (e.g. a dependency
          # version); the files it did fix still belong in the PR, so do not stop on it.
          export BATON="$GITHUB_WORKSPACE" TEMPLATE="$GITHUB_WORKSPACE/.org-template"
          bash scripts/fleet-exec.sh "${args[@]}" -- bash -c '
            [ -f src/main.ts ] || exit 0
            node "$BATON/scripts/check-template-drift.mjs" --fix --template "$TEMPLATE" --dir . --name "$REPO_NAME" || true
          '
