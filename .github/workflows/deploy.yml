name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      node-version:
        # Mirrors the fleet Node default — bump all setup-node workflows together.
        # See Baton/README.md ("Node version").
        type: string
        default: "26"
      dist-path:
        type: string
        default: "dist"
      deploy-private:
        # Private repos can't publish Pages on the org's plan, so the deploy is skipped
        # for them by default instead of failing. Set true only if the plan allows
        # Pages from private repos.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Leaves a visible notice instead of a red run when a private repo skips the deploy.
  skip-private:
    if: ${{ github.event.repository.private && !inputs.deploy-private }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain skipped deploy
        run: |
          msg="Repository is private; skipping the GitHub Pages deploy. Make it public (or pass deploy-private: true) to publish."
          echo "::notice title=Pages deploy skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: ${{ !github.event.repository.private || inputs.deploy-private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Also publish the self-contained `build:single` output (one minified HTML file,
      # for opening from disk or uploading to an LMS) at <Pages URL>/<Repo>-single.html.
      # Must run AFTER the normal build: the PWA precache globs **/*.html, so a file
      # present during `npm run build` would land in every visitor's service-worker cache.
      # Builds into its own directory because Vite empties its outDir. The `-single.html`
      # suffix must match `navigateFallbackDenylist` in the template's vite.config.ts, or
      # the service worker serves index.html in its place to returning visitors.
      # Callers pin @main, so this step can never fail the Pages deploy.
      - name: Add single-file build
        continue-on-error: true
        env:
          DIST: ${{ inputs.dist-path }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if ! node -e "process.exit(require('./package.json').scripts?.['build:single'] ? 0 : 1)"; then
            echo "No build:single script; skipping the single-file build."
            exit 0
          fi
          npm run build:single -- --outDir "$RUNNER_TEMP/single" --emptyOutDir
          cp "$RUNNER_TEMP/single/index.html" "$DIST/$REPO-single.html"
          echo "Published $REPO-single.html ($(du -h "$DIST/$REPO-single.html" | cut -f1))"

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ inputs.dist-path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
