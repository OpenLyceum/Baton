name: Baton self-check

# Validates Baton's own invariants — the skills collection is well-formed and its
# README index is in sync, the fleet Node version agrees across workflows, the
# repository catalog matches its JSON Schema, and the helper scripts and GitHub
# Actions workflows are valid. These guard against drift that otherwise rots
# silently as the repo grows.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "structure/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "structure/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install actionlint 1.7.12
        # Pin both the release and its linux/amd64 checksum. Update together.
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$install_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $install_dir/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$install_dir/actionlint.tar.gz" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Check all Baton workflows
        # ubuntu-latest provides ShellCheck for inline run scripts. Disable the
        # optional Python integration so local and CI checks use the same tools.
        run: |
          command -v shellcheck
          actionlint -color -pyflakes=

  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate the skills collection
        run: scripts/check-skills.sh

      - name: Validate the repository catalog
        run: |
          pip install --quiet jsonschema
          scripts/check-repos-catalog.sh

      - name: Check fleet Node version is in sync
        run: scripts/check-node-version.sh

      - name: Test Knip inventory and template-only entries
        run: python3 -m unittest discover -s tests -p 'test_knip_*.py'

      - name: Detect uncataloged repos
        # Compare the live GitHub org against structure/repos.json so a repo that
        # was created on GitHub but never onboarded can't stay invisible to the
        # fleet tooling. Read-only; the default token can list public org repos.
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-uncataloged.sh

      - name: Lint shell scripts (syntax)
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | while IFS= read -r -d '' s; do
            echo "bash -n $s"
            bash -n "$s"
          done

      - name: Lint shell scripts (shellcheck)
        # ubuntu-latest ships shellcheck. -x follows `source` into lib/repos.sh.
        # SC2034 is excluded: caller scripts set FILTER_*/REPOS_JSON globals that
        # are read inside the sourced lib's functions, which shellcheck can't track
        # across that boundary and wrongly reports as unused.
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 \
            | xargs -0 shellcheck -x -S warning -e SC2034

  bats:
    # Behavioural tests for check-repo-compliance.sh and the Pages index generator.
    # Each compliance rule has a test that breaks exactly that rule on a compliant
    # fixture, so a rule that silently stops firing turns this job red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          # Mirrors the fleet Node default — bump all setup-node workflows together.
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Validate the template manifest and drift checker
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("config/template-manifest.json","utf8"))'
          node --check scripts/check-template-drift.mjs
      - name: Run bats suites
        run: npx bats tests/
