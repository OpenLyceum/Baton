name: Baton self-check

# Validates Baton's own invariants — the skills collection is well-formed and its
# README index is in sync, the fleet Node version agrees across workflows, the
# repository catalog matches its JSON Schema, and the helper scripts are
# syntactically valid. These guard against the kind of drift that otherwise rots
# silently as the repo grows.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "structure/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "structure/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate the skills collection
        run: scripts/check-skills.sh

      - name: Validate the repository catalog
        run: |
          pip install --quiet jsonschema
          scripts/check-repos-catalog.sh

      - name: Check fleet Node version is in sync
        run: scripts/check-node-version.sh

      - name: Detect uncataloged repos
        # Compare the live GitHub org against structure/repos.json so a repo that
        # was created on GitHub but never onboarded can't stay invisible to the
        # fleet tooling. Read-only; the default token can list public org repos.
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-uncataloged.sh

      - name: Lint shell scripts (syntax)
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | while IFS= read -r -d '' s; do
            echo "bash -n $s"
            bash -n "$s"
          done

      - name: Lint shell scripts (shellcheck)
        # ubuntu-latest ships shellcheck. -x follows `source` into lib/repos.sh.
        # SC2034 is excluded: caller scripts set FILTER_*/REPOS_JSON globals that
        # are read inside the sourced lib's functions, which shellcheck can't track
        # across that boundary and wrongly reports as unused.
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 \
            | xargs -0 shellcheck -x -S warning -e SC2034

  bats:
    # Behavioural tests for check-repo-compliance.sh and the Pages index generator.
    # Each compliance rule has a test that breaks exactly that rule on a compliant
    # fixture, so a rule that silently stops firing turns this job red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          # Mirrors the fleet Node default — bump all setup-node workflows together.
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Validate the template manifest and drift checker
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("config/template-manifest.json","utf8"))'
          node --check scripts/check-template-drift.mjs
      - name: Run bats suites
        run: npx bats tests/
